name: Build Mac & iPad IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iPad (.ipa & Xcode project)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Setup Godot 4.7
        run: |
          echo "=== Downloading Godot 4.7 ==="
          curl -L "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_macos.universal.zip" -o godot.zip
          unzip -q godot.zip
          xattr -dr com.apple.quarantine Godot.app || true
          mkdir -p ~/bin
          mv "Godot.app/Contents/MacOS/Godot" ~/bin/godot
          chmod +x ~/bin/godot
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Download Export Templates
        run: |
          echo "=== Downloading Export Templates ==="
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.7.stable
          curl -L "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz" -o templates.tpz
          unzip -q -j templates.tpz "templates/*" -d ~/Library/Application\ Support/Godot/export_templates/4.7.stable/

      - name: Export iOS Xcode Project from Godot
        run: |
          echo "=== Exporting iOS Project from Godot ==="
          mkdir -p "minerts 3D/builds/iOS"
          
          # Install mock xcodebuild in /usr/local/bin to satisfy Godot initial export requirement
          sudo mkdir -p /usr/local/bin
          cat << 'EOF' | sudo tee /usr/local/bin/xcodebuild
          #!/bin/bash
          for arg in "$@"; do
            if [ "$arg" = "archive" ]; then
              echo "** ARCHIVE SUCCEEDED **"
              exit 0
            fi
            if [ "$arg" = "-exportArchive" ]; then
              echo "** EXPORT SUCCEEDED **"
              exit 0
            fi
          done
          echo "** SUCCEEDED **"
          exit 0
          EOF
          sudo chmod +x /usr/local/bin/xcodebuild

          # Run Godot export
          godot --headless --path "minerts 3D" --export-release "iOS" "builds/iOS/minerts_ios"

          # Remove mock xcodebuild
          sudo rm -f /usr/local/bin/xcodebuild

          # Verify exported project
          ls -la "minerts 3D/builds/iOS"
          test -f "minerts 3D/builds/iOS/minerts_ios.xcodeproj/project.pbxproj"

      - name: Build .IPA with Xcode 16
        run: |
          echo "=== Selecting Xcode 16 ==="
          ls -d /Applications/Xcode*.app || true
          XCODE_16=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode.app 2>/dev/null | tail -n 1)
          echo "Using $XCODE_16"
          sudo xcode-select -s "$XCODE_16/Contents/Developer"
          xcodebuild -version

          echo "=== Building with Real Xcode on GitHub Runner ==="
          cd "minerts 3D/builds/iOS"
          
          xcodebuild -project minerts_ios.xcodeproj \
                     -scheme minerts_ios \
                     -sdk iphoneos \
                     -configuration Release \
                     -destination "generic/platform=iOS" \
                     -derivedDataPath build_output \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     IPHONEOS_DEPLOYMENT_TARGET=18.0 \
                     OTHER_LDFLAGS='$(inherited) -weak_framework QuartzCore -weak_framework Metal -Wl,-U,_CADynamicRangeAutomatic -Wl,-U,_CADynamicRangeConstrainedHigh -Wl,-U,_CADynamicRangeHigh -Wl,-U,_CADynamicRangeStandard -Wl,-U,_MTLTensorDomain' \
                     clean build

          # Verify built .app
          APP_PATH="build_output/Build/Products/Release-iphoneos/minerts_ios.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Searching for built .app..."
            APP_PATH=$(find build_output -name "*.app" | head -n 1)
          fi
          echo "Built application: $APP_PATH"
          # Patch Info.plist for iPad compatibility
          plutil -replace UIDeviceFamily -json '[1, 2]' "$APP_PATH/Info.plist"
          plutil -replace MinimumOSVersion -string "15.0" "$APP_PATH/Info.plist"
          codesign -s - --force --deep "$APP_PATH" || true

          # Package into standard .ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q minerts_ipad.ipa Payload
          ls -lh minerts_ipad.ipa

      - name: Upload iPad .IPA Package
        uses: actions/upload-artifact@v4
        with:
          name: minerts-ipad-ipa
          path: "minerts 3D/builds/iOS/minerts_ipad.ipa"
          retention-days: 14

      - name: Upload iPad Xcode Project Archive
        uses: actions/upload-artifact@v4
        with:
          name: minerts-ipad-xcode-project
          path: "minerts 3D/builds/iOS/"
          retention-days: 14

  build-macos:
    name: Build Mac (.app & .zip)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Setup Godot 4.7
        run: |
          curl -L "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_macos.universal.zip" -o godot.zip
          unzip -q godot.zip
          xattr -dr com.apple.quarantine Godot.app || true
          mkdir -p ~/bin
          mv "Godot.app/Contents/MacOS/Godot" ~/bin/godot
          chmod +x ~/bin/godot
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Download Export Templates
        run: |
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.7.stable
          curl -L "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz" -o templates.tpz
          unzip -q -j templates.tpz "templates/*" -d ~/Library/Application\ Support/Godot/export_templates/4.7.stable/

      - name: Export macOS Application
        run: |
          mkdir -p "minerts 3D/builds/macOS"
          godot --headless --path "minerts 3D" --export-release "macOS" "builds/macOS/minerts.zip"

      - name: Upload macOS Application
        uses: actions/upload-artifact@v4
        with:
          name: minerts-macos-app
          path: "minerts 3D/builds/macOS/minerts.zip"
          retention-days: 14

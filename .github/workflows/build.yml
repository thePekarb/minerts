name: Build Mac & iPad IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iPad (.ipa & Xcode project)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Setup Godot 4.7
        run: |
          echo "=== Downloading Godot 4.7 ==="
          curl -L "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_macos.universal.zip" -o godot.zip
          unzip -q godot.zip
          mkdir -p ~/bin
          mv "Godot.app/Contents/MacOS/Godot" ~/bin/godot
          chmod +x ~/bin/godot
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Download Export Templates
        run: |
          echo "=== Downloading Export Templates ==="
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.7.stable
          curl -L "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz" -o templates.tpz
          unzip -q -j templates.tpz "templates/*" -d ~/Library/Application\ Support/Godot/export_templates/4.7.stable/

      - name: Export iOS Xcode Project from Godot
        run: |
          echo "=== Exporting iOS Project from Godot ==="
          mkdir -p "minerts 3D/builds/iOS"
          
          # Temporarily switch xcode-select to CommandLineTools so Godot does not fail on automatic signing
          ORIG_XCODE=$(xcode-select -p)
          echo "ORIG_XCODE=$ORIG_XCODE" >> $GITHUB_ENV
          sudo xcode-select -s /Library/Developer/CommandLineTools || true

          # Godot exports project files (pck, xcodeproj, frameworks) and will skip signing archive
          godot --headless --path "minerts 3D" --export-release "iOS" "builds/iOS/minerts_ios" || true

          # Restore full Xcode developer path
          sudo xcode-select -s "$ORIG_XCODE"
          
          # Verify exported project files
          ls -la "minerts 3D/builds/iOS"
          test -f "minerts 3D/builds/iOS/minerts_ios.xcodeproj/project.pbxproj"

      - name: Build .IPA with macOS-14 Xcode
        run: |
          echo "=== Building with Real Xcode on GitHub Runner ==="
          cd "minerts 3D/builds/iOS"
          
          # Build target without code signing requirement (for sideloading via Sideloadly / AltStore / TrollStore)
          xcodebuild -project minerts_ios.xcodeproj \
                     -scheme minerts_ios \
                     -sdk iphoneos \
                     -configuration Release \
                     -destination "generic/platform=iOS" \
                     -derivedDataPath build_output \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build

          # Verify built .app
          APP_PATH="build_output/Build/Products/Release-iphoneos/minerts_ios.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Searching for built .app..."
            APP_PATH=$(find build_output -name "*.app" | head -n 1)
          fi
          echo "Built application: $APP_PATH"
          ls -lh "$APP_PATH"
          
          # Package into standard .ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q minerts_ipad.ipa Payload
          ls -lh minerts_ipad.ipa

      - name: Upload iPad .IPA Package
        uses: actions/upload-artifact@v4
        with:
          name: minerts-ipad-ipa
          path: "minerts 3D/builds/iOS/minerts_ipad.ipa"
          retention-days: 14

      - name: Upload iPad Xcode Project Archive
        uses: actions/upload-artifact@v4
        with:
          name: minerts-ipad-xcode-project
          path: "minerts 3D/builds/iOS/"
          retention-days: 14

  build-macos:
    name: Build Mac (.app & .zip)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Setup Godot 4.7
        run: |
          curl -L "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_macos.universal.zip" -o godot.zip
          unzip -q godot.zip
          mkdir -p ~/bin
          mv "Godot.app/Contents/MacOS/Godot" ~/bin/godot
          chmod +x ~/bin/godot
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Download Export Templates
        run: |
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.7.stable
          curl -L "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz" -o templates.tpz
          unzip -q -j templates.tpz "templates/*" -d ~/Library/Application\ Support/Godot/export_templates/4.7.stable/

      - name: Export macOS Application
        run: |
          mkdir -p "minerts 3D/builds/macOS"
          godot --headless --path "minerts 3D" --export-release "macOS" "builds/macOS/minerts.zip"

      - name: Upload macOS Application
        uses: actions/upload-artifact@v4
        with:
          name: minerts-macos-app
          path: "minerts 3D/builds/macOS/minerts.zip"
          retention-days: 14
